# Weekly data update pipeline.
#
# What this does, every Monday at 08:35 UTC, with no servers and no API keys:
#   1. Checks out the repo and installs the pinned Python dependencies.
#   2. Runs the full pipeline: IESO scraper -> weather fetch -> charts ->
#      dashboard render. The scraper is incremental: data/processed/
#      manifest.json (committed to git) records which IESO files are already
#      incorporated, so each run downloads only new files -- typically the
#      two rolling current-year files, ~168 hourly price files, and the
#      weather JSONs. No data/raw/ cache is needed: data/raw/ is disposable
#      scratch on the runner, and the manifest is the state.
#      (The first run after the switch to weekly downloads the full
#      multi-year history once to build the manifest; later runs take only
#      a few minutes.)
#   3. Commits data/processed/ and docs/ back to the repo and pushes.
#      GitHub Pages then serves the updated docs/index.html automatically.
#
# The commit step needs `permissions: contents: write` below; the push uses
# the repository's built-in GITHUB_TOKEN, so no personal token is needed.

name: Weekly data update

on:
  schedule:
    # Cron times are UTC. Monday 08:35 UTC is 04:35 EDT (03:35 EST), after
    # the weekend's IESO reports have landed. A missed week is fully
    # backfilled on the next run, so an occasional skipped run is harmless.
    - cron: "35 8 * * 1"
  workflow_dispatch:  # also allow manual runs from the Actions tab

permissions:
  contents: write  # needed for the commit-and-push step at the end

# Never run two copies of this pipeline at once (e.g. the scheduled run
# plus a manual "Run workflow" click): the scraper downloads into the same
# data/raw/ scratch files and rewrites the same processed CSVs, so
# overlapping runs would corrupt each other's work. With
# cancel-in-progress: false the second run waits its turn instead.
concurrency:
  group: weekly-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"  # cache downloaded packages between runs

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Refresh IESO data
        run: python3 -u src/ieso_scraper.py

      - name: Refresh weather data
        run: python3 -u src/weather_fetch.py

      - name: Rebuild charts
        run: python3 -u src/make_charts.py

      - name: Render dashboard
        run: python3 -u src/render_dashboard.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/raw/ is git-ignored, so this only stages the processed
          # CSVs (including manifest.json) and the dashboard/chart HTML.
          git add data/processed docs
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly data update: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
